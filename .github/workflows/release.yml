name: Release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish immutable release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches manifest version
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const version=JSON.parse(fs.readFileSync('manifest.json','utf8')).version; if (process.env.GITHUB_REF_NAME !== version) { throw new Error('Tag must exactly match manifest version'); }"
      - name: Run complete release gate
        run: pnpm run ci
      - name: Publish direct Community assets and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/release/main.js \
            artifacts/release/manifest.json \
            artifacts/release/styles.css \
            artifacts/release/hans-safedoc-"$GITHUB_REF_NAME".zip \
            artifacts/release/hans-safedoc-"$GITHUB_REF_NAME".zip.sha256 \
            artifacts/release/SHA256SUMS.txt \
            artifacts/release/artifact-manifest.json \
            artifacts/release/sbom.cdx.json \
            --verify-tag \
            --generate-notes \
            --title "Hans SafeDoc $GITHUB_REF_NAME"
